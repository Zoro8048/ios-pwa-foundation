<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0a84ff" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="114" fill="#000000" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="url(#bgGrad)" />

  <!-- Glass Inner Phone -->
  <g filter="url(#glow)">
    <rect x="136" y="76" width="240" height="360" rx="42" fill="url(#phoneGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="4" />
    <!-- Dynamic Island Pill -->
    <rect x="216" y="96" width="80" height="18" rx="9" fill="#000000" />
    <!-- Home Indicator -->
    <rect x="206" y="408" width="100" height="6" rx="3" fill="rgba(255,255,255,0.7)" />
    <!-- Screen Accent Lines -->
    <circle cx="256" cy="236" r="38" fill="none" stroke="url(#bgGrad)" stroke-width="8" stroke-dasharray="160 40" />
    <path d="M 238 236 L 252 250 L 276 222" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
